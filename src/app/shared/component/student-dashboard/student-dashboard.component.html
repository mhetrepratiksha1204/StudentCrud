<div class="row">
    <div class="col-md-4 mb-4 md-mb-0">
        <div class="card mt-5">
            <div class="card-body">

                <!-- <h1 class="font-weight-bold">Add Student</h1> -->
                <h1> {{isEditmode ? 'Update student': 'Add todo' }}</h1>
                <div class="form-group">
                    <label for="fname">First Name*</label>
                    <input type="text" #fnameRef class="form-control">
                </div>

                <div class="form-group">
                    <label for="lname">Last Name*</label>
                    <input type="text" #lnameRef class="form-control">
                </div>
                <div class="form-group">
                    <label for="contact">Contact*</label>
                    <input type="text" #contact class="form-control">
                </div>
                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="text" #emailRef class="form-control">
                </div>
                <div class="form-group">
                    <label for="isactive">isActive</label>
                    <select #ActiveRef class="form-control">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <button class="w-100" *ngIf="!isEditmode" (click)="onAddStd()" mat-raised-button color="primary">
                    Add Student
                </button>

                <button (click)="onUpdate()" class="w-100" *ngIf="isEditmode" mat-raised-button color="danger">
                    Update Student
                </button>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card mt-5">
            <div class="card-body table-responsive">
                <table class="table table-bordered mb-0" *ngIf="studentArr.length > 0; else noStd">
                    <thead>
                        <tr>
                            <th>Sr no</th>
                            <th>Full Name</th>
                            <th>Contact</th>
                            <th>Email</th>
                            <th>isActive</th>
                            <th>Edit</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let std of studentArr; let i = index; trackBy:trackByStdId">
                            <td>{{i +1}}</td>
                            <td>{{std.fname}}{{std.lname}}</td>
                            <td>{{std.contact}}</td>
                            <td>{{std.email}}</td>
                            <td class="text-center">
                                <span class="badge" [ngClass]="{
                            'badge-success': std.isActive,
                            'badge-danger':  !std.isActive
                        }">
                                    {{std.isActive ? 'Yes':'No' }}
                                </span>
                            </td>

                            <td>
                                <button (click)="onstdEdit(std)" mat-mini-fab color="primary">
                                    <mat-icon>edit</mat-icon>
                                </button>
                            </td>
                            <td>
                                <button (click)="onstdRemove(std.stdId)" mat-mini-fab color="success">
                                    <mat-icon>delete</mat-icon>
                                </button>

                            </td>
                        </tr>
                    </tbody>

                </table>
                <ng-template #noStd>
                    <p class="alert alert-warning">
                        no student added yet...!
                    </p>
                </ng-template>
            </div>
        </div>
    </div>
</div>
